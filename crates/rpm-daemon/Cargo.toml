[package]
name = "rpm-daemon"
description = "The rpm collection daemon: serves rpm library folders on a NAS to the rpm apps on the local network."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "rpm-collection-daemon"
path = "src/main.rs"

[lib]
name = "rpm_daemon"
path = "src/lib.rs"

[dependencies]
rpm-wire.workspace = true
rpm-peer.workspace = true
rpm-collection.workspace = true
tokio.workspace = true
tokio-util.workspace = true
hyper.workspace = true
async-trait.workspace = true
serde.workspace = true
toml.workspace = true
log.workspace = true
gethostname.workspace = true

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
