name: Release

# On a version tag (v0.1.0): static binaries, the Synology packages, the Docker image on GHCR, and a
# GitHub release with the files.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            synology: x86_64
          - target: aarch64-unknown-linux-musl
            synology: armv8
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Install zig and cargo-zigbuild
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild
      - name: Build
        run: cargo zigbuild --release -p rpm-daemon --target ${{ matrix.target }}
      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/rpm-collection-daemon dist/rpm-collection-daemon-${{ matrix.target }}
          sh packaging/synology/build.sh ${{ matrix.synology }} target/${{ matrix.target }}/release/rpm-collection-daemon "$VERSION" dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          IMAGE=ghcr.io/${{ github.repository_owner }}/rpm-collection-daemon
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f packaging/docker/Dockerfile \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" --push .

  release:
    needs: [binaries, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Add the Linux install files
        run: cp packaging/linux/install.sh packaging/linux/rpm-collection-daemon.service dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
