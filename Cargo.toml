[workspace]
resolver = "2"
members = ["crates/rpm-wire", "crates/rpm-peer", "crates/rpm-collection"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/rpmrpmrpm/rpm-collection-daemon"
rust-version = "1.85"

[workspace.dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_repr = "0.1"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "fs", "io-util", "macros", "sync", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = { version = "0.7", features = ["io"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
async-trait = "0.1"
time = "0.3"
mdns-sd = "0.13"
log = "0.4"
x509-parser = "0.16"
tempfile = "3"
rpm-wire = { path = "crates/rpm-wire" }
rpm-peer = { path = "crates/rpm-peer" }
rpm-collection = { path = "crates/rpm-collection" }
lofty = "0.22"
unicode-normalization = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
